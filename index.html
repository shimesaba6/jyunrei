<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>島ねこ御朱印帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #fdfbf7;
        }
        body {
            font-family: 'Yuji Syuku', serif;
            background-color: #d9d0c1;
            overflow: hidden;
            touch-action: pan-y;
        }
        
        .book-wrapper {
            perspective: 1500px;
        }

        .goshuin-page {
            background-color: var(--paper-bg);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            box-shadow: 2px 2px 0px #eae3d5, 4px 4px 0px #e0d8c8, 6px 6px 0px #d6cdbc, 12px 12px 20px rgba(0,0,0,0.2);
            border-radius: 4px 12px 12px 4px;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding-left: 24px;
            transform-origin: left center;
            backface-visibility: hidden;
            transform-style: preserve-3d;
        }

        .goshuin-page::before {
            content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 24px;
            background: linear-gradient(to right, #2c3e50, #34495e);
            border-radius: 4px 0 0 4px;
            box-shadow: 3px 0 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        #cover-page {
            z-index: 40;
            background-size: cover;
            background-position: center;
            background-color: #637b89;
        }
        #cover-title-plate {
            background-color: rgba(253, 251, 247, 0.9);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            border: 2px solid #bdae93;
        }

        .flip-open { animation: flipLeft 0.6s ease-in-out forwards; pointer-events: none; }
        .flip-close { animation: flipRight 0.6s ease-in-out forwards; }
        
        .turn-next-out { animation: turnNextOut 0.35s ease-in forwards; pointer-events: none; }
        .turn-next-in  { animation: turnNextIn 0.2s ease-out forwards; }
        .turn-prev-in  { animation: turnPrevIn 0.4s ease-out forwards; }
        
        @keyframes flipLeft {
            0% { transform: rotateY(0deg); opacity: 1; }
            100% { transform: rotateY(-100deg); opacity: 0; }
        }
        @keyframes flipRight {
            0% { transform: rotateY(-100deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }
        @keyframes turnNextOut {
            0% { transform: rotateY(0deg); opacity: 1; }
            100% { transform: rotateY(-90deg); opacity: 0.3; } 
        }
        @keyframes turnNextIn {
            0% { transform: rotateY(0deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }
        @keyframes turnPrevIn {
            0% { transform: rotateY(-90deg); opacity: 1; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        .ink-blend { mix-blend-mode: multiply; pointer-events: auto; }
        @keyframes ink-bleed {
            0% { opacity: 0; filter: blur(12px); transform: scale(0.95); }
            50% { opacity: 0.8; filter: blur(3px); transform: scale(1.02); }
            100% { opacity: 1; filter: blur(0px); transform: scale(1); }
        }
        .animate-ink { animation: ink-bleed 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        
        .tategaki { writing-mode: vertical-rl; text-orientation: upright; }
    </style>
</head>
<body class="w-full h-screen flex flex-col items-center justify-center p-4 relative" id="body-container">

    <!-- ヘッダー -->
    <div class="absolute top-4 left-4 z-50">
        <button onclick="openSettings()" class="bg-white/80 backdrop-blur-sm text-gray-700 px-3 py-1 rounded-full text-xs font-bold shadow-sm border border-gray-300 active:scale-95">⚙️ 表紙設定</button>
    </div>
    
    <div class="absolute top-14 left-0 w-full text-center z-10 pointer-events-none transition-opacity duration-300" id="header-progress" style="opacity: 0;">
        <h1 class="text-xl font-bold tracking-widest text-[#3a312a]">
            久比エリア <span id="progress-text" class="text-3xl text-orange-700 mx-1">0/10</span> <span class="text-sm">巡礼済</span>
        </h1>
    </div>

    <!-- 御朱印帳本体 -->
    <div id="book-container" class="book-wrapper w-full max-w-md aspect-[3/4] relative mt-8">
        
        <!-- 【表紙】 -->
        <div id="cover-page" class="goshuin-page flex items-center justify-center cursor-pointer shadow-2xl">
            <div id="cover-title-plate" class="w-16 h-4/5 flex items-center justify-center tategaki absolute right-8 top-1/2 transform -translate-y-1/2">
                <span class="text-3xl font-black text-gray-800 tracking-widest">島ねこ御朱印帳</span>
            </div>
            <div class="absolute bottom-4 left-8 text-white text-xs bg-black/50 px-3 py-1 rounded-full animate-pulse">タップして開く</div>
        </div>

        <!-- 【中身のページ】 -->
        <div id="inner-page" class="goshuin-page pointer-events-none" style="opacity: 0; z-index: 10;">
            <div id="page-content" class="w-full h-full relative flex items-center justify-center">
                <!-- JSで描画 -->
            </div>
        </div>

    </div>

    <!-- フッター -->
    <div class="absolute bottom-6 left-0 w-full text-center z-10 pointer-events-none transition-opacity duration-300" id="footer-swipe" style="opacity: 0;">
        <p class="text-sm font-bold text-[#5c544d] opacity-70">← スワイプでめくる →</p>
        <button onclick="closeBook()" class="mt-2 text-xs text-gray-500 bg-white/50 px-3 py-1 rounded-full pointer-events-auto shadow-sm active:scale-95 border border-gray-300">表紙に戻る</button>
    </div>

    <!-- ★ 表紙設定モーダル ★ -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity">
        <div class="bg-[#fdfbf7] rounded-xl p-6 w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-xl font-black text-gray-800 mb-4">表紙をきせかえる</h2>
            
            <div class="mb-4">
                <p class="text-xs text-gray-500 font-bold mb-2">スマホの写真アルバムから選ぶ</p>
                <label class="block bg-orange-500 text-white py-3 rounded-lg font-bold shadow-md active:scale-95 cursor-pointer">
                    📷 写真を選択
                    <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </label>
            </div>

            <div class="mb-6">
                <p class="text-xs text-gray-500 font-bold mb-2">テンプレートから選ぶ</p>
                <div class="flex gap-2 justify-center">
                    <div onclick="setCoverColor('#637b89')" class="w-12 h-12 bg-[#637b89] rounded cursor-pointer border-2 border-gray-300"></div>
                    <div onclick="setCoverColor('#8b4513')" class="w-12 h-12 bg-[#8b4513] rounded cursor-pointer border-2 border-gray-300"></div>
                    <div onclick="setCoverColor('#b04a5a')" class="w-12 h-12 bg-[#b04a5a] rounded cursor-pointer border-2 border-gray-300"></div>
                </div>
            </div>

            <button onclick="closeSettings()" class="w-full bg-gray-300 text-gray-800 py-3 rounded-full font-bold active:scale-95">とじる</button>
        </div>
    </div>

    <!-- 歴史解説モーダル -->
    <div id="history-modal" class="fixed inset-0 bg-black/70 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity">
        <div class="bg-[#fdfbf7] rounded-xl p-6 w-full max-w-sm shadow-2xl relative border-l-8 border-orange-500">
            <h2 id="modal-title" class="text-xl font-black text-gray-800 mb-4 border-b-2 border-orange-200 pb-2"></h2>
            <p id="modal-text" class="text-sm font-medium text-gray-700 leading-relaxed mb-6"></p>
            <div id="modal-haru" class="bg-orange-50 p-3 rounded-lg border border-orange-200 hidden">
                <p id="modal-haru-text" class="text-[13px] font-bold text-orange-800"></p>
            </div>
            <button onclick="closeModal()" class="mt-6 w-full bg-gray-800 text-white py-3 rounded-full font-bold active:scale-95">もどる</button>
        </div>
    </div>

    <script>
        // --- 音声ファイルの準備 ---
        const sndCat = new Audio('./catvoice2.mp3');
        const sndOpen = new Audio('./bookopen.mp3');
        const sndClose = new Audio('./bookclose.mp3');
        const sndPage = new Audio('./page.mp3');

        // 新しくねこを見つけたかどうかを判定するフラグ
        let isNewDiscoveryScan = false;

        const GOSHUIN_DATA = {
            "mamena": {
                id: "mamena", area: "kubi", pageNumber: 1, 
                image: "./n1.png",
                history: {
                    title: "まめな食堂と久比の記憶",
                    text: "ここ久比地区は、かつて多くの船が行き交い、温かなコミュニティがありました。",
                    haruMessage: "ハルさんより：「よう来てくれたね。」"
                }
            }
        };
        const TOTAL_PAGES = 10;

        let unlockedPages = JSON.parse(localStorage.getItem('goshuin_unlocked')) || [];
        let currentPage = 1;
        let isBookOpen = false;

        const savedCover = localStorage.getItem('goshuin_cover_image');
        const savedColor = localStorage.getItem('goshuin_cover_color');
        const coverEl = document.getElementById('cover-page');
        if (savedCover) { coverEl.style.backgroundImage = `url(${savedCover})`; }
        else if (savedColor) { coverEl.style.backgroundColor = savedColor; }

        window.onload = () => {
            updateProgress();
            renderPage(currentPage, false);
            setupSwipe();
            checkNfcScan();
        };

        coverEl.addEventListener('click', () => {
            if(isBookOpen) return;
            isBookOpen = true;

            // 🔊 1. 表紙を開く音を鳴らす
            sndOpen.currentTime = 0;
            sndOpen.play().catch(e => console.log('Audio error:', e));

            coverEl.classList.remove('flip-close');
            coverEl.classList.add('flip-open');
            
            const innerPage = document.getElementById('inner-page');
            innerPage.style.opacity = '1';
            innerPage.classList.remove('pointer-events-none');
            
            // ★ 新しく御朱印を見つけた時の特別な演出
            if (isNewDiscoveryScan) {
                setTimeout(() => {
                    // 🔊 2. 本が開ききったタイミングで「ニャー」と鳴らす
                    sndCat.currentTime = 0;
                    sndCat.play().catch(e => console.log('Audio error:', e));
                    
                    // 御朱印がジワッと浮かび上がるアニメーションを発動
                    renderPage(currentPage, true); 
                    isNewDiscoveryScan = false; // フラグをリセット
                }, 500); // ページが開くアニメーションの長さに合わせる
            } else {
                renderPage(currentPage, false);
            }
            
            setTimeout(() => {
                document.getElementById('header-progress').style.opacity = '1';
                document.getElementById('footer-swipe').style.opacity = '1';
            }, 300);
        });

        function closeBook() {
            isBookOpen = false;
            
            // 🔊 3. 表紙を閉じる音を鳴らす
            sndClose.currentTime = 0;
            sndClose.play().catch(e => console.log('Audio error:', e));

            document.getElementById('header-progress').style.opacity = '0';
            document.getElementById('footer-swipe').style.opacity = '0';
            coverEl.classList.remove('flip-open');
            coverEl.classList.add('flip-close');
            
            const innerPage = document.getElementById('inner-page');
            innerPage.classList.add('pointer-events-none');
            setTimeout(() => { innerPage.style.opacity = '0'; }, 500);
        }

        function setupSwipe() {
            let startX = 0;
            const innerPage = document.getElementById('inner-page');

            innerPage.addEventListener('touchstart', (e) => { startX = e.changedTouches[0].screenX; });
            innerPage.addEventListener('touchend', (e) => {
                if(!isBookOpen) return;
                let endX = e.changedTouches[0].screenX;
                let diff = startX - endX;

                if (diff > 50 && currentPage < TOTAL_PAGES) {
                    turnPage(currentPage + 1, 'next');
                } else if (diff < -50 && currentPage > 1) {
                    turnPage(currentPage - 1, 'prev');
                } else if (diff < -50 && currentPage === 1) {
                    closeBook();
                }
            });
        }

        function turnPage(newPage, direction) {
            const innerPage = document.getElementById('inner-page');
            
            // 🔊 4. ページをめくる音を鳴らす
            sndPage.currentTime = 0;
            sndPage.play().catch(e => console.log('Audio error:', e));

            innerPage.classList.remove('turn-next-out', 'turn-next-in', 'turn-prev-in');
            void innerPage.offsetWidth; 
            
            if (direction === 'next') {
                innerPage.classList.add('turn-next-out');
                setTimeout(() => {
                    currentPage = newPage;
                    renderPage(currentPage, false);
                    innerPage.classList.remove('turn-next-out');
                    innerPage.classList.add('turn-next-in'); 
                }, 350); 
            } else {
                currentPage = newPage;
                renderPage(currentPage, false);
                innerPage.classList.add('turn-prev-in');
            }
        }

        function openSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }
        function closeSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const MAX_SIZE = 1600;
                    
                    let width = img.width; let height = img.height;
                    if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } 
                    else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    
                    localStorage.setItem('goshuin_cover_image', dataUrl);
                    localStorage.removeItem('goshuin_cover_color');
                    coverEl.style.backgroundImage = `url(${dataUrl})`;
                    coverEl.style.backgroundColor = 'transparent';
                    closeSettings();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function setCoverColor(colorCode) {
            localStorage.setItem('goshuin_cover_color', colorCode);
            localStorage.removeItem('goshuin_cover_image');
            coverEl.style.backgroundImage = 'none';
            coverEl.style.backgroundColor = colorCode;
            closeSettings();
        }

        function checkNfcScan() {
            const urlParams = new URLSearchParams(window.location.search);
            const scanId = urlParams.get('cat');
            if (scanId && GOSHUIN_DATA[scanId]) {
                currentPage = GOSHUIN_DATA[scanId].pageNumber; 

                if (!unlockedPages.includes(scanId)) {
                    unlockedPages.push(scanId);
                    localStorage.setItem('goshuin_unlocked', JSON.stringify(unlockedPages));
                    
                    // ★ 新規発見フラグをオンにする
                    isNewDiscoveryScan = true; 
                } else {
                    renderPage(currentPage, false);
                }
                window.history.replaceState(null, '', window.location.pathname);
            }
        }

        function renderPage(pageNum, isNewDiscovery) {
            const content = document.getElementById('page-content');
            content.innerHTML = '';
            let pageData = null;
            for (const key in GOSHUIN_DATA) { if (GOSHUIN_DATA[key].pageNumber === pageNum) pageData = GOSHUIN_DATA[key]; }

            if (pageData && unlockedPages.includes(pageData.id)) {
                const animClass = isNewDiscovery ? 'animate-ink' : '';
                
                content.innerHTML = `
                    <div class="w-full h-full flex flex-col items-center justify-center cursor-pointer pt-6 pb-4 pr-4 pl-2" onclick="openModal('${pageData.id}')">
                        <div class="flex-1 w-full flex items-center justify-center overflow-hidden">
                            <img src="${pageData.image}" class="w-[90%] h-[90%] object-contain ink-blend ${animClass} drop-shadow-sm">
                        </div>
                        <div class="mt-2 bg-black/40 text-white text-[10px] px-3 py-1 rounded-full animate-pulse whitespace-nowrap shrink-0">
                            👆 タップして小話を読む
                        </div>
                    </div>
                `;
            } else {
                content.innerHTML = `<div class="w-full h-full flex flex-col items-center justify-center opacity-30"><p class="text-gray-500 text-lg">第 ${pageNum} 頁</p></div>`;
            }
        }
        function updateProgress() { document.getElementById('progress-text').innerText = `${unlockedPages.length}/${TOTAL_PAGES}`; }
        window.openModal = function(catId) {
            const data = GOSHUIN_DATA[catId].history; if(!data) return;
            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-text').innerHTML = data.text;
            document.getElementById('history-modal').classList.remove('hidden'); document.getElementById('history-modal').classList.add('flex');
            setTimeout(() => document.getElementById('history-modal').classList.remove('opacity-0'), 10);
        };
        window.closeModal = function() {
            document.getElementById('history-modal').classList.add('opacity-0');
            setTimeout(() => { document.getElementById('history-modal').classList.add('hidden'); document.getElementById('history-modal').classList.remove('flex'); }, 300);
        };
    </script>
</body>
</html>
